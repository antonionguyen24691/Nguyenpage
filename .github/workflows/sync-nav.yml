name: "🔄 Daily NAV Sync"

on:
  schedule:
    # Chạy mỗi ngày lúc 01:00 UTC = 08:00 sáng VN
    - cron: "0 1 * * *"
  workflow_dispatch:
    # Cho phép bấm chạy tay trên GitHub Actions UI

jobs:
  sync:
    name: Crawl & Sync Fund NAV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run NAV sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/sync_nav.py
